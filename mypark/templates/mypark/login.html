<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyPark — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #EEF2F7;
        }
        .login-card {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        .btn-mypark {
            background-color: #7EB8F7;
            color: white;
            border: none;
        }
        .btn-mypark:hover {
            background-color: #5a9fd4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <h1 class="fw-bold">🅿️ MyPark</h1>
                <p class="text-muted">Sistema de gestión de parking corporativo</p>
            </div>
            <div class="card login-card p-4">
                <form method="post">
                    {% csrf_token %}
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        ⚠️ {{ error }}
                    </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Introduce tu usuario">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Introduce tu contraseña">
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-mypark">Iniciar sesión</button>
                    </div>
                    <p class="text-center text-muted mt-3" style="font-size:12px;">
                        ¿Has olvidado tu contraseña? Contacta con el departamento de IT
                    </p>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
